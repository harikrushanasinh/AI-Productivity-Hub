<div class="shell">
  <aside class="sidebar aph-glass">
    <div class="brand">AI Productivity Hub</div>
    <nav>
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-link">
          <span class="icon">{{ item.icon }}</span>{{ item.label }}
        </a>
      }
    </nav>
    <button class="theme-toggle" (click)="theme.toggle()">
      {{ theme.mode() === 'dark' ? '☀️ Light mode' : '🌙 Dark mode' }}
    </button>
    <button class="logout-btn" (click)="auth.logout()">Log out</button>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
