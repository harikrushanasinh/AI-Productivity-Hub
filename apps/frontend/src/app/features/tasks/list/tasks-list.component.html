<h1>Tasks</h1>

<div class="new-task aph-glass">
  <input
    type="text"
    placeholder="What needs to be done?"
    [ngModel]="newTitle()"
    (ngModelChange)="newTitle.set($event)"
    (keyup.enter)="createTask()"
  />
  <button (click)="createTask()">Add</button>
</div>

@if (loading()) {
  <p>Loading tasks…</p>
} @else if (tasks().length === 0) {
  <p class="empty-state">No tasks yet — add one above to get started.</p>
} @else {
  <ul class="task-list">
    @for (task of tasks(); track trackByTaskId($index, task)) {
      <li class="task-row aph-glass" [class.done]="task.status === 'done'">
        <input type="checkbox" [checked]="task.status === 'done'" (change)="toggleDone(task)" />
        <span class="title">{{ task.title }}</span>
        <span class="priority" [attr.data-priority]="task.priority">{{ task.priority }}</span>
        <button class="delete-btn" (click)="deleteTask(task.id)">✕</button>
      </li>
    }
  </ul>
}
